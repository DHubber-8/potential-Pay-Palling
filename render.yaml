# Owner: Digant
# Status: in progress
services:
  - type: web
    name: dispute-helper-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dispute-helper-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_BASE_URL
        sync: false
      - key: PAYPAL_REPORT_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CARRIER_API_BASE_URL
        sync: false
      - key: ELASTIC_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false

databases:
  - name: dispute-helper-db
    plan: free
    databaseName: dispute_helper
    user: dispute_helper
