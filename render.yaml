services:
  - type: web
    name: api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: FRONTEND_ORIGIN
        value: https://dashboard.onrender.com

  - type: static
    name: dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

  - type: worker
    name: delivery-watch
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.delivery_watch

  - type: cron
    name: deadlines
    runtime: python
    rootDir: backend
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.deadlines
