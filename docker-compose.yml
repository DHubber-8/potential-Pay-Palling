services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dispute_helper
      POSTGRES_USER: dispute_helper
      POSTGRES_PASSWORD: dispute_helper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

