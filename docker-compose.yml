# Owner: Digant
# Status: in progress
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dispute_helper
      POSTGRES_USER: dispute_helper
      POSTGRES_PASSWORD: dispute_helper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispute_helper -d dispute_helper"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql://dispute_helper:dispute_helper@db:5432/dispute_helper
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
